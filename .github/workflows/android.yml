name: Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING_KEY: ${{ secrets.AJM_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a fixed signing key (repository secrets), so each new APK installs as an
      # update over the last one. Without it the APK is signed with a throwaway debug key.
      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.AJM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ajm-release.jks"
          echo "AJM_KEYSTORE_PATH=$RUNNER_TEMP/ajm-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :core:test

      - name: Build release APK
        env:
          AJM_WEB_APP_URL: ${{ vars.AJM_WEB_APP_URL }}
          AJM_KEYSTORE_PASSWORD: ${{ secrets.AJM_KEYSTORE_PASSWORD }}
          AJM_KEY_ALIAS: ${{ secrets.AJM_KEY_ALIAS }}
          AJM_KEY_PASSWORD: ${{ secrets.AJM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/AJM-Office-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AJM-Office-apk
          path: ${{ runner.temp }}/AJM-Office-*.apk
          if-no-files-found: error
